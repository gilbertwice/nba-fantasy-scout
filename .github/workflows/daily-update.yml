name: Daily NBA data update
on:
  schedule:
    # 12:17 Asia/Taipei = 04:17 UTC; schedule may be delayed
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and aggregate public box scores
        run: python scripts/update.py
      - name: Commit only when data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NBA player data"
            git push
          fi
